name: StarPad Android (Thor)

on:
  workflow_dispatch:
  push:
    branches:
      - thor
      - thor-v11

permissions:
  contents: read

env:
  CCACHE_COMPILERCHECK: content

jobs:
  build_android:
    name: Build Android APK (arm64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            make \
            ninja-build \
            pkg-config \
            perl \
            unzip \
            zip

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android components
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.3.11579264" >> "${GITHUB_ENV}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # StarPad signing key: generated on the first run and kept in this
      # repository's private Actions cache, so later APKs install over the
      # previous one without losing data. No key is stored in the repo.
      - name: Restore StarPad signing key
        id: signing-key
        uses: actions/cache@v4
        with:
          path: ~/.starpad-signing/starpad.keystore
          key: starpad-signing-key-v1

      - name: Create StarPad signing key
        if: steps.signing-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${HOME}/.starpad-signing"
          keytool -genkeypair -keystore "${HOME}/.starpad-signing/starpad.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=StarPad"

      - name: Use StarPad signing key
        run: echo "STAR_SIGNING_KEYSTORE=${HOME}/.starpad-signing/starpad.keystore" >> "${GITHUB_ENV}"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64-Release
          max-size: 2G

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "**/source/vcpkg.json"
          vcpkgConfigurationJsonGlob: "**/source/vcpkg-configuration.json"

      - name: Select CMake presets
        run: |
          echo "OSBM_VERSION=$(tr -d ' \n' < VERSION)" >> "${GITHUB_ENV}"

          if [ "Release" = "Debug" ]; then
            SUFFIX=debug
            if [ "arm64" = "universal" ]; then
              echo "Universal APKs are release-only; pick a single arch for Debug builds." >&2
              exit 1
            fi
          else
            SUFFIX=release
          fi

          case "arm64" in
            arm64)
              echo "CMAKE_PRESETS=android-arm64-${SUFFIX}" >> "${GITHUB_ENV}"
              ;;
            armv7)
              echo "CMAKE_PRESETS=android-armv7-${SUFFIX}" >> "${GITHUB_ENV}"
              ;;
            x86_64)
              echo "CMAKE_PRESETS=android-x64-${SUFFIX}" >> "${GITHUB_ENV}"
              ;;
            universal)
              echo "CMAKE_PRESETS=android-armv7-release android-arm64-release android-x64-release" >> "${GITHUB_ENV}"
              ;;
          esac

      # Each gradle run clears other APKs from the variant outputs dir, so
      # stage every APK immediately after the build that produced it.
      - name: Build per-ABI APKs
        working-directory: source
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/apk-staging"
          if [ "Release" = "Debug" ]; then
            APK_DIR=application/mobile/android/host/app/build/outputs/apk/debug
          else
            APK_DIR=application/mobile/android/host/app/build/outputs/apk/release
          fi
          for PRESET in ${CMAKE_PRESETS}; do
            echo "::group::${PRESET}"
            cmake --preset "${PRESET}" -DVCPKG_INSTALL_OPTIONS=--clean-after-build \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            cmake --build --preset "${PRESET}" --target android_apk --parallel
            cp -v "${APK_DIR}"/oSBM-*.apk "${GITHUB_WORKSPACE}/apk-staging/"
            echo "::endgroup::"
          done

      - name: Build universal APK
        if: ${{ false }}
        working-directory: source
        run: |
          cmake --build --preset android-universal-release
          cp -v application/mobile/android/host/app/build/outputs/apk/release/oSBM-*.apk "${GITHUB_WORKSPACE}/apk-staging/"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: StarPad-android-arm64
          path: apk-staging/oSBM-*.apk
          if-no-files-found: error
